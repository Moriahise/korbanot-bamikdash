name: Deploy static site to GitHub Pages

# Läuft bei jedem Push auf main und lässt sich zusätzlich
# jederzeit von Hand starten (Actions -> Run workflow).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Minimale Rechte, die deploy-pages benötigt.
permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein Pages-Deployment gleichzeitig.
# cancel-in-progress: false -> laufende Deployments werden nicht abgebrochen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          # Gesamtes Repository-Verzeichnis hochladen.
          # .git und .github werden automatisch ausgeschlossen.
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # 30 Minuten statt der Standard-10-Minuten.
          # Angabe in Millisekunden.
          timeout: 1800000
          # Nach einem Fehler nicht sofort aufgeben.
          error_count: 10
