name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # TEST-SCHRITT: baut _site ohne Mediendateien.
      # Damit pruefen wir, ob die Groesse das Deployment blockiert.
      - name: Seite ohne Medien zusammenstellen
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude '*.mp3' \
            --exclude '*.mp4' \
            --exclude '*.wav' \
            --exclude '*.m4a' \
            --exclude '*.mov' \
            ./ _site/
          echo "--- Groesse von _site ---"
          du -sh _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
